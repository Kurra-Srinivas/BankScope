name: Production CI & Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test:
    name: CI Test Suite & Security Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Safe Offline Unit Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Repository Hygiene & Zero Committed Secrets
        run: |
          # Verify no sensitive credential files are tracked in git
          if git ls-files | grep -E "(^|/)\.env$|(^|/)secrets\.toml$"; then
            echo "ERROR: Sensitive credential files tracked by git!"
            exit 1
          fi
          echo "Confirmed: No secret files tracked."
          python -c "import streamlit, pandas, sqlalchemy, plotly, psycopg2; print('Core dependencies import successfully.')"

  production-verify:
    name: Live Production Health Verification
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://bankscope-c9yej9ugps7vfku7kq6rt6.streamlit.app/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Live Streamlit Community Cloud Deployment
        run: |
          python -m pip install requests
          python -c "
          import requests
          import sys
          import time

          target_url = 'https://bankscope-c9yej9ugps7vfku7kq6rt6.streamlit.app/'
          health_url = 'https://bankscope-c9yej9ugps7vfku7kq6rt6.streamlit.app/_stcore/health'
          headers = {'User-Agent': 'BankScope-Deployment-Verifier/1.0'}

          print(f'Probing live production endpoint: {target_url}')
          
          # Allow retry for container restart or deployment reload
          max_retries = 6
          success = False
          
          for attempt in range(1, max_retries + 1):
              try:
                  session = requests.Session()
                  session.headers.update(headers)
                  resp = session.get(target_url, allow_redirects=True, timeout=15)
                  print(f'Attempt {attempt}: Target HTTP {resp.status_code}')
                  
                  if resp.status_code == 200:
                      h_resp = session.get(health_url, timeout=10)
                      print(f'Attempt {attempt}: Health HTTP {h_resp.status_code}')
                      if h_resp.status_code == 200:
                          print('CONFIRMED: Live Streamlit Community Cloud deployment is active and healthy.')
                          success = True
                          break
              except Exception as e:
                  print(f'Attempt {attempt} connection notice: {e}')
              
              if attempt < max_retries:
                  print('Waiting 10s before retry...')
                  time.sleep(10)

          if not success:
              print('ERROR: Live production deployment check failed!')
              sys.exit(1)
          "

      - name: Production Status Summary
        run: |
          echo "======================================================="
          echo "BankScope Production Verification Succeeded"
          echo "Target Host: Streamlit Community Cloud"
          echo "Live URL: https://bankscope-c9yej9ugps7vfku7kq6rt6.streamlit.app/"
          echo "Production environment status registered as active."
          echo "======================================================="
